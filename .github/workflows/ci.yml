name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEMORY_MIGRATE_SRC: ${{ runner.temp }}/reasonix-memory
      MEMORY_MIGRATE_PROJECT: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare migration fixture path
        run: mkdir -p "$MEMORY_MIGRATE_SRC"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
