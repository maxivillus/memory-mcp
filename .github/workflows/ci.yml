name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        env:
          MEMORY_MIGRATE_SRC: ${{ runner.temp }}/reasonix-memory
          MEMORY_MIGRATE_PROJECT: ci
        run: |
          mkdir -p "$MEMORY_MIGRATE_SRC"
          python -m unittest discover -s tests -v
          python -m unittest -q test_memory_mcp
